<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Night Quantitative Trading Dashboard</title>
  <desc id="desc">A dark navy quantitative trading dashboard with cyan and amber candlestick charts, equity curve, and risk metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0b1d35"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102641"/><stop offset="1" stop-color="#0b1d34"/></linearGradient>
    <linearGradient id="cyanFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#28e1e8" stop-opacity=".28"/><stop offset="1" stop-color="#28e1e8" stop-opacity="0"/></linearGradient>
    <filter id="glowCyan"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowAmber"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="56" height="42" patternUnits="userSpaceOnUse"><path d="M56 0H0V42" fill="none" stroke="#1a3a58" stroke-width="1" opacity=".52"/></pattern>
    <style>
      .label{font:500 14px Inter,Arial,sans-serif;letter-spacing:1.4px;fill:#7595b5}.value{font:600 27px Inter,Arial,sans-serif;fill:#e5f5ff}.small{font:500 12px Inter,Arial,sans-serif;fill:#7393b3}.axis{font:500 12px Inter,Arial,sans-serif;fill:#61809e}.mono{font:500 13px 'JetBrains Mono',Consolas,monospace;fill:#a7c6de}.metric{font:600 19px Inter,Arial,sans-serif;fill:#ddf5ff}.muted{fill:#80a0bd}.cyan{fill:#35e5ed}.amber{fill:#ffbd59}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="-80" r="390" fill="#0c3458" opacity=".25"/>
  <circle cx="1500" cy="780" r="330" fill="#063e52" opacity=".14"/>

  <!-- Header -->
  <rect x="38" y="28" width="1524" height="92" rx="16" fill="#0b1b31" stroke="#204363"/>
  <rect x="61" y="51" width="44" height="44" rx="12" fill="#1bd8df" opacity=".15" stroke="#2ce3eb"/>
  <path d="M72 80l8-11 7 7 11-17" fill="none" stroke="#36edf1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="125" y="69" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#e7f8ff">NOVA / QUANT</text>
  <text x="125" y="91" class="small">SYSTEMATIC STRATEGIES · LIVE RESEARCH TERMINAL</text>
  <circle cx="1260" cy="73" r="6" fill="#35e5ed" filter="url(#glowCyan)"/><text x="1277" y="79" class="mono">MARKET OPEN</text>
  <text x="1433" y="79" class="mono">21:47:08 UTC</text>

  <!-- KPI row -->
  <g>
    <rect x="38" y="144" width="242" height="112" rx="14" fill="url(#panel)" stroke="#1c3c5b"/><text x="60" y="173" class="label">PORTFOLIO VALUE</text><text x="60" y="213" class="value">$4,827,391</text><text x="60" y="237" class="cyan mono">+12.84%  YTD</text>
    <rect x="296" y="144" width="242" height="112" rx="14" fill="url(#panel)" stroke="#1c3c5b"/><text x="318" y="173" class="label">TODAY'S P&amp;L</text><text x="318" y="213" class="value">+$38,642</text><text x="318" y="237" class="cyan mono">+0.81%  ▲ 4.2σ</text>
    <rect x="554" y="144" width="242" height="112" rx="14" fill="url(#panel)" stroke="#1c3c5b"/><text x="576" y="173" class="label">SHARPE RATIO</text><text x="576" y="213" class="value">2.41</text><text x="576" y="237" class="amber mono">TARGET  &gt; 1.80</text>
    <rect x="812" y="144" width="242" height="112" rx="14" fill="url(#panel)" stroke="#1c3c5b"/><text x="834" y="173" class="label">MAX DRAWDOWN</text><text x="834" y="213" class="value">−6.18%</text><text x="834" y="237" class="cyan mono">WITHIN LIMIT</text>
    <rect x="1070" y="144" width="492" height="112" rx="14" fill="url(#panel)" stroke="#1c3c5b"/><text x="1094" y="173" class="label">MODEL STATUS</text><circle cx="1098" cy="207" r="7" fill="#35e5ed" filter="url(#glowCyan)"/><text x="1117" y="214" class="metric">ORION-7  /  EXECUTING</text><text x="1094" y="239" class="mono">alpha confidence  87.3%     latency  3.8ms</text>
  </g>

