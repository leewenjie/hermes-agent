  <text x="92" y="845" class="axis">19:00</text><text x="300" y="845" class="axis">20:00</text><text x="510" y="845" class="axis">21:00</text><text x="720" y="845" class="axis">22:00</text><text x="916" y="845" class="axis">23:00</text>

